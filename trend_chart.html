function labelFmt(p) {

}

// ---- Summary chart: 3 countries filling ratio ----

    textStyle: { fontSize: 16, color: '#333', fontWeight: 'bold' }
  },

    axisPointer: { type: 'line' },
    formatter: function(params) {
      var html = params[0].axisValue + '<br/>';
      params.forEach(function(p) {
        if (p.data !== null && p.data !== undefined) {
          html += p.marker + p.seriesName + ': ' + p.value + '%';
          html += ' (填写规范问题: ' + p.data.problemCount + '/' + p.data.total + ')<br/>';

// ---- Country chart factory ----
function makeCountryChart(domId, title, countryKey) {
  var chart = echarts.init(document.getElementById(domId));
  var cd = chartData.countries[countryKey];
  chart.setOption({
    title: {
      text: title,
      left: 'center', top: 5,
      textStyle: { fontSize: 14, color: '#333', fontWeight: 'bold' }
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'line' },
      formatter: function(params) {
        var html = params[0].axisValue + '<br/>';
        params.forEach(function(p) {
          if (p.data !== null && p.data !== undefined) {
            html += p.marker + p.seriesName + ': ' + p.value + '%';
            html += ' (' + p.data.problemCount + '/' + p.data.total + ')<br/>';
          }
        });
        return html;
      }
    },
    legend: { data: ['填写规范问题', '识别问题'], top: 30, textStyle: { fontSize: 11 } },
    grid: { left: '10%', right: '5%', bottom: '15%', top: 65 },
    xAxis: {
      type: 'category', data: cd.dates,
      axisLabel: { rotate: 35, fontSize: 11 },
      boundaryGap: false
    },
    yAxis: {
      type: 'value', max: 100,
      axisLabel: { formatter: '{value}%' },
      splitLine: { lineStyle: { type: 'dashed' } }
    },
    series: [
      {
        name: '填写规范问题', type: 'line',
        data: cd.fillData,
        itemStyle: { color: colors.fill }, lineStyle: { width: 2 }, symbolSize: 7,
        label: { show: true, position: 'top', formatter: labelFmt, fontSize: 10, color: colors.fill }
      },
      {
        name: '识别问题', type: 'line',
        data: cd.recData,
        itemStyle: { color: colors.rec }, lineStyle: { width: 2 }, symbolSize: 7,
        label: { show: true, position: 'bottom', formatter: labelFmt, fontSize: 10, color: colors.rec }
      }
    ]
  });
  return chart;
}
